name: Verify and deploy portfolio

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete verification suite
        run: npm run check

      - name: Preserve tested production artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: Deploy production to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://joshua-nwachinemere.pages.dev
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: true

    steps:
      - name: Restore tested production artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist

      - name: Deploy exact commit to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name joshua-nwachinemere
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "Automated production deployment"
          --commit-dirty=false
