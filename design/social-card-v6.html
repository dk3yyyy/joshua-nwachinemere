<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Joshua Nwachinemere social card</title>
  <style>
    @font-face { font-family: Manrope; src: url('../public/fonts/manrope-variable.woff2') format('woff2'); font-weight: 400 800; }
    @font-face { font-family: Newsreader; src: url('../public/fonts/newsreader-italic-500.woff2') format('woff2'); font-style: italic; font-weight: 500; }
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { color: #15171a; background: #f3f3f0; font-family: Manrope, Arial, sans-serif; }
    .card { position: relative; display: grid; grid-template-columns: 630px 380px; gap: 30px; width: 100%; height: 100%; padding: 72px 80px 68px; }
    .card::before { content: ''; position: absolute; inset: 26px; border: 1px solid #c4c6c2; border-radius: 28px; pointer-events: none; }
    .copy { position: relative; z-index: 1; display: flex; flex-direction: column; }
    .identity { display: flex; align-items: center; gap: 15px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .seal { display: grid; width: 52px; height: 52px; place-items: center; border: 1.5px solid #45494d; border-radius: 50%; font-size: 14px; letter-spacing: .08em; }
    .role { margin: 50px 0 14px; color: #383c40; font-size: 19px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { max-width: 620px; margin: 0; font-size: 60px; font-weight: 650; letter-spacing: -.055em; line-height: 1.01; }
    h1 em { color: #383c40; font-family: Newsreader, Georgia, serif; font-weight: 500; }
    .proof { margin: 28px 0 0; color: #383c40; font-size: 23px; font-weight: 650; line-height: 1.45; }
    .proof span { color: #565b60; font-size: 20px; font-weight: 600; }
    .url { margin-top: auto; font-size: 18px; font-weight: 700; letter-spacing: .01em; }
    .map { position: relative; align-self: center; width: 380px; height: 380px; border: 1px solid #b7bab5; border-radius: 34px; background-color: rgba(251,251,249,.82); background-image: radial-gradient(circle, rgba(69,73,77,.18) 1px, transparent 1px); background-size: 20px 20px; }
    .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map path { fill: none; stroke: #696e72; stroke-width: 2; }
    .core { position: absolute; top: 50%; left: 50%; display: grid; width: 108px; height: 108px; place-content: center; border-radius: 50%; color: #fbfbf9; background: #15171a; text-align: center; transform: translate(-50%,-50%); }
    .core strong { font-size: 27px; letter-spacing: .06em; }
    .core span { margin-top: 7px; color: #d8dad6; font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .node { position: absolute; min-width: 124px; padding: 14px 13px; border: 1px solid #b7bab5; border-radius: 9px; background: #fbfbf9; box-shadow: 0 8px 22px rgba(21,23,26,.06); text-align: center; }
    .node strong { display: block; font-size: 20px; line-height: 1.1; }
    .n1 { top: 37px; left: 33px; }
    .n2 { top: 37px; right: 28px; }
    .n3 { bottom: 37px; right: 28px; }
    .n4 { bottom: 37px; left: 33px; }

  </style>
</head>
<body>
  <main class="card" role="img" aria-label="Joshua Nwachinemere, AI Engineer. Reliable Python systems for retrieval, multimodal and voice AI. Five inspectable projects and nine merged upstream contributions.">
    <section class="copy">
      <div class="identity"><span class="seal">JN</span><span>Joshua Nwachinemere</span></div>
      <p class="role">AI Engineer</p>
      <h1>Reliable Python systems for <em>applied AI.</em></h1>
      <p class="proof">Retrieval · Multimodal and voice · Evaluation<br><span>5 inspectable projects · 9 merged upstream contributions</span></p>
      <p class="url">Portfolio · joshua-nwachinemere.pages.dev</p>
    </section>
    <section class="map" aria-hidden="true">

      <svg viewBox="0 0 394 394">
        <defs>
          <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#696e72" stroke="none" /></marker>
        </defs>
        <path d="M151 76 H247" marker-end="url(#arrow)" />
        <path d="M315 111 V272" marker-end="url(#arrow)" />
        <path d="M247 319 H151" marker-end="url(#arrow)" />
        <path d="M80 272 V111" marker-end="url(#arrow)" />
      </svg>
      <div class="core"><strong>JN</strong><span>Engineer</span></div>
      <div class="node n1"><strong>Input</strong></div>
      <div class="node n2"><strong>Retrieval</strong></div>
      <div class="node n3"><strong>Routing</strong></div>
      <div class="node n4"><strong>Evaluation</strong></div>
    </section>
  </main>
</body>
</html>
