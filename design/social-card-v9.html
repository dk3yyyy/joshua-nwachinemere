<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Cal Sans'; src: url('../public/fonts/cal-sans-400.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: Archivo; src: url('../public/fonts/archivo-var.woff2') format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; }
html,body { margin:0; width:1200px; height:630px; overflow:hidden; }
body { display:flex; flex-direction:column; padding:48px 56px 40px; background:#fafafa; color:#111110; font-family:Archivo,Arial,sans-serif; }
.top { display:flex; align-items:center; justify-content:space-between; padding-bottom:20px; border-bottom:1px solid #e7e4dd; }
.brand { display:flex; align-items:center; gap:12px; font-size:18px; font-weight:650; letter-spacing:-.02em; }
.mark { display:grid; width:38px; height:38px; place-items:center; border-radius:9px; background:#f2c200; font:700 12px/1 ui-monospace,monospace; }
.top small { color:#45453f; font:600 14px/1 ui-monospace,monospace; letter-spacing:.07em; text-transform:uppercase; }
h1 { max-width:1040px; margin:36px 0 0; font-family:'Cal Sans',Archivo,Arial,sans-serif; font-size:96px; font-weight:400; line-height:1.14; letter-spacing:-.04em; }
h1 mark { padding:.04em .16em .11em; background:#f2c200; color:#111110; border-radius:6px; }
.row { display:flex; align-items:center; gap:10px; margin-top:30px; }
.pill { display:flex; align-items:center; gap:8px; padding:7px 12px 7px 7px; border:1px solid #d8d4cb; border-radius:10px; background:#fff; font-size:17px; font-weight:620; }
.icon { display:grid; width:28px; height:28px; place-items:center; border-radius:6px; background:#f2c200; font:700 10px/1 ui-monospace,monospace; }
.pill.alt .icon { background:#f4f2ec; }
.note { margin-left:auto; color:#45453f; font:550 16px/1.4 ui-monospace,monospace; }
.bottom { display:flex; align-items:end; justify-content:space-between; margin-top:auto; padding-top:18px; border-top:1px solid #e7e4dd; }
.bottom p { margin:0; color:#45453f; font-size:17px; }
.bottom strong { color:#111110; font-weight:650; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><span class="mark">JN</span> Joshua Nwachinemere</div>
    <small>AI Engineer · Python and applied AI</small>
  </div>
  <h1>Python systems that<br><mark>show their work.</mark></h1>
  <div class="row">
    <span class="pill"><span class="icon">01</span>Volyx Lens</span>
    <span class="pill alt"><span class="icon">02</span>Local Review</span>
    <span class="pill alt"><span class="icon">03</span>Football Lab</span>
    <span class="note">13 merged upstream PRs</span>
  </div>
  <div class="bottom">
    <p><strong>Retrieval, context and evaluation.</strong> Every answer can be inspected.</p>
    <p>joshua-nwachinemere.pages.dev</p>
  </div>
</body>
</html>
